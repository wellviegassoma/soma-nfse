<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>SOMA · SEI</title>
  <style>
    :root { --fg:#1d2433; --muted:#6b7280; --border:#e5e7eb; --brand:#0f6b5c; --bg:#f7f7f5; --ok:#15803d; --err:#b91c1c; --warn:#b45309; }
    * { box-sizing: border-box; }
    body { margin:0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--fg); background:var(--bg); }
    main { max-width: 820px; margin: 32px auto; padding: 0 16px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p.sub { color: var(--muted); margin: 0 0 20px; }
    .card { background:#fff; border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:16px; }
    .linha { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:6px 0; }
    .linha + .linha { border-top:1px solid var(--border); }
    .rot { font-weight:600; }
    .st { color:var(--muted); text-align:right; }
    .st.ok { color:var(--ok); } .st.err { color:var(--err); } .st.warn { color:var(--warn); }
    select, button { font: inherit; }
    select { padding:6px 8px; border:1px solid var(--border); border-radius:8px; background:#fff; }
    button { padding:9px 16px; border-radius:8px; border:1px solid var(--brand); background:var(--brand); color:#fff; font-weight:600; cursor:pointer; }
    button.sec { background:#fff; color:var(--brand); }
    button:disabled { opacity:.5; cursor:default; }
    .acoes { display:flex; gap:8px; flex-wrap:wrap; }
    progress { width:100%; height:10px; margin:12px 0 4px; }
    #resumo { color:var(--muted); font-size:13px; }
    #log { font: 12px/1.5 ui-monospace, Consolas, monospace; background:#111827; color:#e5e7eb; border-radius:8px; padding:10px 12px; height:320px; overflow:auto; white-space:pre-wrap; }
    #log .err { color:#fca5a5; } #log .ok { color:#86efac; } #log .dim { color:#9ca3af; }
  </style>
</head>
<body>
<main>
  <h1>SOMA · SEI</h1>
  <p class="sub">Traz os processos do SEI de Petrópolis (acesso externo) para o SOMA Gestão › Legalização › SEI.</p>

  <div class="card">
    <div class="linha">
      <span class="rot">SOMA Gestão</span>
      <select id="base">
        <option value="https://nfse.somaintegrada.com.br">Produção (nfse.somaintegrada.com.br)</option>
        <option value="http://localhost:3000">Local (localhost:3000)</option>
      </select>
    </div>
    <div class="linha"><span>Login no SOMA</span><span class="st" id="stSoma">verificando…</span></div>
    <div class="linha"><span>Aba do SEI logada</span><span class="st" id="stSei">verificando…</span></div>
  </div>

  <div class="card">
    <div class="acoes">
      <button id="btnSync" disabled>Sincronizar agora</button>
      <button id="btnParar" class="sec" disabled>Parar</button>
      <button id="btnVerificar" class="sec">Verificar de novo</button>
    </div>
    <progress id="prog" max="1" value="0"></progress>
    <div id="resumo">Antes: faça login no SEI numa aba (gov.br) e no SOMA Gestão neste Chrome.</div>
  </div>

  <div id="log"></div>
</main>
<script src="sync.js"></script>
</body>
</html>
